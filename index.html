<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.4/dist/tailwind.min.css" rel="stylesheet">
    <script src="./js/script.js" defer></script>
</head>
<body>

    <form id="search-form" class="bg-white p-4 rounded-xl shadow-lg flex">
    <label for="city">Choisir une ville</label>

    <input
        type="text"
        id="city"
        placeholder="Entrez le nom d'une ville"
        class="border-2 border-gray-300  rounded-lg px-4 py-2 outline-none "
    >

    <button type="submit" class="border-2 border-blue-500 text-blue-500 px-4 py-2 rounded-lg hover:bg-blue-500 hover:text-white transition">Rechercher</button>
</form>

<p id="message-erreur"></p>
<p id="loading" hidden>Chargement...</p>

</body>
</html>
