
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.4/dist/tailwind.min.css" rel="stylesheet">
    <script type="module" src="./js/script.js" defer></script>
</head>

<body class="min-h-screen bg-gray-100 flex flex-col items-center justify-center p-4">

    <form id="search-form"
        class="w-full max-w-md bg-white p-6 rounded-xl shadow-lg flex flex-col gap-4">

        <label for="city" class="text-gray-700 font-semibold">
            Choisir une ville
        </label>

        <input
            type="text"
            id="city"
            placeholder="Entrez le nom d'une ville"
            class="w-full border-2 border-gray-300 rounded-lg px-4 py-2 outline-none focus:border-blue-500"
        >

        <button
            type="submit"
            class="w-full bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition">
            Rechercher
        </button>
    </form>

    <p id="message-erreur" class="text-red-500 mt-3"></p>

    <p id="loading" hidden class="text-blue-500 mt-3">
        Chargement...
    </p>
    <button id="btn" type="button" hidden class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600">Réessayer</button>

  <div id="Weather-card"
     class="w-full max-w-md mt-6 p-6 bg-blue-100 rounded-xl shadow-lg text-center">
</div>
<div id="forecast-weather"
     class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mt-6">
</div>
</body>
</html>
